services:
  brocade-netbox-san-sync:
    build: .
    container_name: brocade-netbox-san-sync
    restart: unless-stopped
    volumes:
      # your real config.yaml (copied from config.example.yaml), with
      # real values filled in directly -- NetBox URL/token, switch
      # host/user/password, all of it. This is the only thing the
      # container needs; nothing else to configure here.
      - ./config.yaml:/app/config/config.yaml:ro
    command: ["--config", "/app/config/config.yaml", "--interval", "900"]

    # For a one-shot run (e.g. from an external cron/scheduler) instead
    # of the built-in --interval loop, override command:
    #   command: ["--config", "/app/config/config.yaml"]
    # and run with `docker compose run --rm brocade-netbox-san-sync`.
